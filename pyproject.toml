[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-jev"
version = "0.1.0"
description = "EmbodiedJev / Xingzhi: typed decisions in real MuJoCo robot physics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/embodied_jev/assets/panda/LICENSE"]
dependencies = ["mujoco==3.13.0", "numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
minicpm = ["torch>=2.6,<3", "transformers==4.57.6", "accelerate>=1.3,<2"]

[project.scripts]
embodied-jev = "embodied_jev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embodied_jev = ["assets/**/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
